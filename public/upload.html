<!DOCTYPE html>
<html>
<head>
    <title>Upload PDF and Preview</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="/styles.css">
    <link rel="stylesheet" href="fonts/remixicon.css">
</head>

<body>
    <div class="top">
        <button type="button" id="backToLandingBtn" class="btn-back-corner">
            <i class="ri-arrow-left-fill"></i>
            Back
            </button>
    </div>
    <div class="container">
        <!-- LEFT SIDE — PREVIEW -->
        <div class="preview-container">
            <h2>Preview</h2>

            <form id="uploadForm">
                <input type="file" name="pdfFile" accept="application/pdf" style="display: none;" required />
                <button type="button" id="uploadBtn">Upload PDF</button>
                <div id="preview">
                    <div id="preview-overlay" class="hidden">
                        <div class="overlay-content">
                            <div id="loader-spinner" class="spinner"></div>
                            <p id="overlay-text">Processing PDF...</p>
                        </div>
                    </div>
                </div>
            </form>
        </div>

        <!-- RIGHT SIDE — FORM -->
        <div class="form-container">
            <h2>Document specifications</h2>
            <br>

            <form id="settingsForm">

                <div id="settings">
                    <div class="setting-row">
                        <label for="color">Color:</label>
                        <select id="color" name="color">
                            <option value="bw" selected>Black & White</option>
                            <option value="color">Colored</option>
                        </select>
                    </div>

                    <div class="setting-row">
                        <label for="pageMode">Pages:</label>
                        <select id="pageMode">
                            <option value="all" selected>All Pages</option>
                            <option value="odd">Odd Pages Only</option>
                            <option value="even">Even Pages Only</option>
                            <option value="custom">Custom</option>
                        </select>
                    </div>

                    <div id="customPageWrapper">
                        <input type="text" id="pages" placeholder="e.g., 1-3, 5" disabled>
                    </div>

                    <div class="setting-row">
                        <label for="copies">Copies:</label>
                        <input type="number" id="copies" min="1" max="5" step="1" value="1" required>
                    </div>

                    <div class="setting-row">
                        <label for="paperSize">Paper Size:</label>
                        <select id="paperSize">
                            <option value="letter" selected>Letter (short) - 8"x11"</option>
                            <option value="legal">Legal (long) - 8"x13"</option>
                        </select>
                    </div>
                </div>
                <div id="limit-warning" style="color: #d9534f; font-weight: bold; margin-bottom: 10px; display: none; font-size: 0.9em;"></div>
                
                <div class="buttons">
                    <button type="button" id="proceedBtn">Proceed</button>
                    <button type="button" id="clearBtn" hidden>Clear</button>
                </div>

            </form>
        </div>

    </div>
    <div id="loading-overlay" style="display: none;">
			<div class="spinner"></div>
			<p id="loading-text">Loading...</p>		
    </div>
    <script src="/loading.js"></script>
    <script src="/app.js"></script>
</body>
</html>
