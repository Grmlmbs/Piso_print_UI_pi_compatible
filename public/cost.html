<!DOCTYPE html>
<html>
<head>
    <title>Printing Cost</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
        <div class="cost-box"> <h2>Document Price</h2>
            <div class="price-display">
                <h1>₱<span id="cost">...</span></h1>
            </div>

            <div class="details-list">
                <p><strong>Color:</strong> <span id="color"></span></p>
                <p><strong>Pages:</strong> <span id="pages"></span></p>
                <p><strong>Copies:</strong> <span id="copies"></span></p>
                <p><strong>Paper:</strong> <span id="paper"></span></p>
            </div>

            <hr>

            <div class="payment-section">
                <label for="payment">Enter Payment Amount:</label>
                <input type="number" id="payment" min="0" placeholder="0.00">
                <p id="status"></p>
            </div>

            <div class="cost-action-area">
                <button id="printBtn">Print Now</button>
                <button id="cancelBtn" class="btn-admin">Cancel</button>
            </div>
        </div>

<script src="cost.js"></script>
</body>
</html>
