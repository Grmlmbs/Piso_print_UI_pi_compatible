<!DOCTYPE html>
<html>
<head>
    <title>Printing Cost</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
</head>
<body class="admin-body">
        <div class="cost-box"> <h2>Document Price</h2>
            <div class="price-display">
                <h1>₱<span id="cost">...</span></h1>
            </div>

            <div class="details-list">
                <p><strong>Color:</strong> <span id="color"></span></p>
                <p><strong>List of pages:</strong> <span id="pages"></span></p>
                <p><strong>No. of copies:</strong> <span id="copies"></span></p>
                <p><strong>Paper size:</strong> <span id="paper"></span></p>
            </div>

            <hr>

            <div class="payment-section">
                <h2>Inserted Coin:</h2>
                <div class="inserted-amount">
                    <h1>₱<span id="inserted-balance">0</span></h1>
                </div>
                <h3 id="status">Please insert coins</h3>
                <p class="no-change-warning" style="color: #d9534f; font-weight: bold; font-size: 0.8rem; margin-top: -10px;">!WARNING!: THIS MACHINE DOESN'T RETURN CHANGE, PLEASE INSERT EXACT AMOUNT ONLY!</p>
            </div>

            <div class="cost-action-area">
                <button id="printBtn">Print Now</button>
                <button id="cancelBtn" class="btn-admin">Cancel</button>
            </div>
        </div>
        <div id="loading-overlay" style="display: none;">
			<div class="spinner"></div>
			<p id="loading-text">Loading...</p>		
		</div>
<script src="/loading.js"></script>
<script src="/socket.io/socket.io.js"></script>
<script src="cost.js"></script>
</body>
</html>
