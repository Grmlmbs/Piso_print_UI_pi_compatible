<!DOCTYPE html>
<html class="landing-html" lang="en">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>Piso Print Kiosk</title>
	<link rel="stylesheet" href="styles.css">
</head>
<body class="landing-body">
	<div id="loading-overlay" style="display: none">
		<div class="spinner"></div>
		<p id="loading-text">Loading...</p>		
	</div>
	
	<div class="landing-container">
		<img src="/sources/ursLogo.png" class="ursLogo" width="100">
		<h1>Piso Print Kiosk</h1>
		<p>Fast and easy printing for everyone</p>
		<div class="btn-group">
			<button class="btn-main" onclick="startKiosk()">Start Printing</button>
			<button class="btn-main btn-admin" onclick="goToAdmin()">Admin Login</button>
		</div>
	</div>

	<script src="/socket.io/socket.io.js"></script>
	<script>
		const socket = io();

			// Listen for the 'update_balance' message from the Pi
			socket.on('update_balance', (newBalance) => {
			display.innerText = "Credits: " + newBalance;
			alert("Coin detected! You now have " + newBalance + " credits.");
		});
	</script>
	
	<script src="/loading.js"></script>
	<script src="/landing.js"></script>
</body>
</html>
